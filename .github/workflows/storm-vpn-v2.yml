name: Storm SSH v2 Android

on:
  pull_request:
    paths:
      - 'AndroidClientV2/**'
      - '.github/workflows/storm-vpn-v2.yml'
  push:
    branches:
      - main
    paths:
      - 'AndroidClientV2/**'
      - '.github/workflows/storm-vpn-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '2.0.0'
  SOCKSTUN_COMMIT: 'f8d9e25cb3ebd712c1e092c619d539820fd1c8e0'

jobs:
  build:
    name: Build Storm SSH v2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SSH Plus Manager
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;29.0.14206865'

      - name: Fetch pinned tun2socks base
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh-v2"
          git clone --recursive https://github.com/heiher/sockstun.git "$APP_DIR"
          cd "$APP_DIR"
          git checkout "$SOCKSTUN_COMMIT"
          git submodule update --init --recursive

      - name: Apply Storm SSH v2 overlay
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh-v2"
          cp -a "$GITHUB_WORKSPACE/AndroidClientV2/overlay/." "$APP_DIR/"
          cd "$APP_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("app/build.gradle")
          s = app_gradle.read_text()
          s = s.replace('applicationId "hev.sockstun"', 'applicationId "cloud.hoststorm.stormssh"')
          s = s.replace('versionCode 12', 'versionCode 200')
          s = s.replace('versionName "8.0"', 'versionName "2.0.0"')
          needle = "implementation 'com.google.android.material:material:1.12.0'"
          dependency = "implementation 'com.github.mwiede:jsch:0.2.23'"
          if dependency not in s:
              if needle not in s:
                  raise SystemExit("Material dependency anchor not found in app/build.gradle")
              s = s.replace(needle, needle + "\n\t" + dependency)
          app_gradle.write_text(s)

          root_gradle = Path("build.gradle")
          s = root_gradle.read_text()
          if "mavenCentral()" not in s:
              s = s.replace("\t\tgoogle()", "\t\tgoogle()\n\t\tmavenCentral()")
          root_gradle.write_text(s)

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = re.sub(
              r'<string name="app_name">[^<]*</string>',
              '<string name="app_name">Storm SSH</string>',
              s,
          )
          strings.write_text(s)
          PY

          echo '--- root repositories ---'
          grep -n -E 'google\(\)|mavenCentral\(\)|jcenter\(\)' build.gradle
          echo '--- app identity/dependency ---'
          grep -n -E 'applicationId|versionCode|versionName|mwiede:jsch' app/build.gradle

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh-v2"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          APK_NAME="StormSSH-v${APP_VERSION}.apk"
          APK_SOURCE="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/$APK_NAME" > "$GITHUB_WORKSPACE/$APK_NAME.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormSSH-v${{ env.APP_VERSION }}
          path: |
            StormSSH-v${{ env.APP_VERSION }}.apk
            StormSSH-v${{ env.APP_VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="storm-ssh-v${APP_VERSION}"
          APK="StormSSH-v${APP_VERSION}.apk"
          SUM="${APK}.sha256"
          NOTES="Storm SSH v${APP_VERSION}: novo motor VPN baseado em tun2socks, SSH fixo em ssh.hoststorm.cloud:2222, persistencia em segundo plano, perfis de rede, atalhos de APN/rede/bateria e interface Storm."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Storm SSH v${APP_VERSION}" \
              --notes "$NOTES"
          fi
