name: Storm SSH Android

on:
  pull_request:
    paths:
      - 'AndroidClient/**'
      - '.github/workflows/storm-ssh-android.yml'
  push:
    branches:
      - main
    paths:
      - 'AndroidClient/**'
      - '.github/workflows/storm-ssh-android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '1.0.1'
  UPSTREAM_COMMIT: 'b390c792fb345bdc2b9160bc9d6bb067ee0cfb21'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SSH Plus Manager
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Fetch pinned VPN/SSH base
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh"
          git clone https://github.com/44114/socks5.git "$APP_DIR"
          cd "$APP_DIR"
          git checkout "$UPSTREAM_COMMIT"

      - name: Apply Storm SSH overlay
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh"
          cp -a "$GITHUB_WORKSPACE/AndroidClient/overlay/." "$APP_DIR/"

          cd "$APP_DIR"
          sed -i 's/applicationId = "com.socks5"/applicationId = "cloud.hoststorm.stormssh"/' app/build.gradle.kts
          sed -i 's/versionCode = 302/versionCode = 2/' app/build.gradle.kts
          sed -i 's/versionName = "3.0.2"/versionName = "1.0.1"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">Socks5 Proxy</string>#<string name="app_name">Storm SSH</string>#' app/src/main/res/values/strings.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_storm"#' app/src/main/AndroidManifest.xml

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/stormssh"
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

          APK_NAME="StormSSH-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/$APK_NAME" > "$GITHUB_WORKSPACE/$APK_NAME.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormSSH-v${{ env.APP_VERSION }}
          path: |
            StormSSH-v${{ env.APP_VERSION }}.apk
            StormSSH-v${{ env.APP_VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="storm-ssh-v${APP_VERSION}"
          APK="StormSSH-v${APP_VERSION}.apk"
          SUM="${APK}.sha256"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Storm SSH v${APP_VERSION}" \
              --notes "Correção de segundo plano: túnel SSH movido para escopo do aplicativo, VPN iniciada como foreground service persistente, START_STICKY, wake lock durante a conexão e proteção contra encerramento ao minimizar/remover a interface. Servidor pré-configurado: ssh.hoststorm.cloud:2222."
          fi

      - name: Record successful release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && success()
        shell: bash
        run: |
          set -euo pipefail
          cat > AndroidClient/RELEASE_STATUS.md <<EOF
          # Storm SSH release status

          Build: SUCCESS
          Version: ${APP_VERSION}
          Tag: storm-ssh-v${APP_VERSION}
          APK: StormSSH-v${APP_VERSION}.apk
          Source commit: ${GITHUB_SHA}
          Server: ssh.hoststorm.cloud:2222
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AndroidClient/RELEASE_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Storm SSH release [skip ci]'
          git push
